<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Content &rarr; Question &rarr; Game Platform</title>
    <!-- Google Fonts: Be Vietnam Pro & JetBrains Mono for AI-native gaming & studio typography (taste-skill-ignore) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@500;700;800&display=swap" /> <!-- taste-skill-ignore -->
    <style>
      :root,
      [data-theme="dark"] {
        color-scheme: dark;
        --font-sans: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; /* taste-skill-ignore */

        /* Premium Colorful AI Studio & Gaming Platform — Deep Obsidian Studio Room */
        --bg-body: #090c15;
        --bg-surface: #101424;
        --bg-card: #151b2e;
        --bg-card-hover: #1c243d;
        --bg-input: #0c101c;
        --bg-elevated: #212a46;

        --text-primary: #f8fafc;
        --text-secondary: #a3b3cc;
        --text-muted: #6e809e;

        --border-subtle: #1f2842;
        --border-strong: #313e63;
        --border-focus: #38bdf8;

        /* Brand & Primary Action Tokens */
        --brand-purple: #3b5bdb;
        --brand-purple-hover: #364fc7;
        --brand-purple-dark: #2b42b8;
        --brand-purple-subtle: rgba(59, 91, 219, 0.16);
        --primary: #38bdf8;
        --primary-hover: #0ea5e9;
        --primary-active: #0284c7;
        --primary-subtle: rgba(56, 189, 248, 0.15);
        --primary-ink: #060913;

        /* Multi-Hue Semantic & Category Accents */
        --accent-sky: #38bdf8;
        --accent-sky-subtle: rgba(56, 189, 248, 0.15);
        --accent-emerald: #12b886;
        --accent-emerald-subtle: rgba(18, 184, 134, 0.15);
        --accent-amber: #f08c00;
        --accent-amber-subtle: rgba(240, 140, 0, 0.15);
        --accent-rose: #f43f5e;
        --accent-rose-subtle: rgba(244, 63, 94, 0.15);
        --accent-violet: #ae3ec9;
        --accent-violet-subtle: rgba(174, 62, 201, 0.16);
        --accent-teal: #14b8a6;
        --accent-teal-subtle: rgba(20, 184, 166, 0.15);
        --accent-coral: #fb923c;
        --accent-coral-subtle: rgba(251, 146, 60, 0.15);
        --accent-lime: #a3e635;
        --accent-lime-subtle: rgba(163, 230, 53, 0.15);

        /* 4-Answer Gameplay Tokens (High-Contrast, Vivid Interactive Play) */
        --k-red: #e63946;
        --k-red-dark: #b91c1c;
        --k-red-hover: #c92a2a;
        --k-blue: #3578d4;
        --k-blue-dark: #194d99;
        --k-blue-hover: #245ea8;
        --k-yellow: #f08c00;
        --k-yellow-dark: #b45309;
        --k-yellow-hover: #d97706;
        --k-yellow-ink: #060913;
        --k-green: #12b886;
        --k-green-dark: #047857;
        --k-green-hover: #059669;

        /* Unified 6 Game Format Tokens */
        --game-mc: var(--k-red);
        --game-mc-hover: var(--k-red-hover);
        --game-mc-subtle: rgba(230, 57, 70, 0.15);
        --game-qb: var(--k-blue);
        --game-qb-hover: var(--k-blue-hover);
        --game-qb-subtle: rgba(53, 120, 212, 0.15);
        --game-fill: var(--k-yellow);
        --game-fill-hover: var(--k-yellow-hover);
        --game-fill-subtle: rgba(240, 140, 0, 0.15);
        --game-cross: var(--k-green);
        --game-cross-hover: var(--k-green-hover);
        --game-cross-subtle: rgba(18, 184, 134, 0.15);
        --game-mixed: #ae3ec9;
        --game-mixed-hover: #9c36b5;
        --game-mixed-subtle: rgba(174, 62, 201, 0.16);
        --game-adventure: #f97316;
        --game-adventure-hover: #ea580c;
        --game-adventure-subtle: rgba(249, 115, 22, 0.16);

        /* Game Cover & Illustration Stage Tokens (Dark Mode) */
        --home-cover-bg: #111628;
        --home-cover-secondary: #182038;
        --home-cover-panel: #1d2642;
        --discover-cover-bg: #111628;
        --discover-cover-secondary: #182038;
        --discover-cover-panel: #1d2642;
        --cover-mc-bg: #191224;
        --cover-mc-secondary: #251936;
        --cover-qb-bg: #0f192f;
        --cover-qb-secondary: #172647;
        --cover-fill-bg: #1d1612;
        --cover-fill-secondary: #2b2018;
        --cover-cross-bg: #0d1f1e;
        --cover-cross-secondary: #142e2c;
        --cover-mixed-bg: #16132b;
        --cover-mixed-secondary: #211c40;
        --cover-adv-bg: #12182b;
        --cover-adv-secondary: #1b243f;
        --cover-ink-strong: #f8fafc;
        --cover-ink-muted: #94a3b8;
        --discover-cover-badge-bg: rgba(9, 12, 21, 0.9);
        --discover-cover-badge-text: #f8fafc;
        --discover-cover-badge-border: rgba(255, 255, 255, 0.18);
        --discover-status-pub-bg: rgba(6, 78, 59, 0.94);
        --discover-status-pub-text: #6ee7b7;
        --discover-status-pub-border: rgba(18, 184, 134, 0.45);
        --discover-status-draft-bg: rgba(120, 53, 15, 0.94);
        --discover-status-draft-text: #fcd34d;
        --discover-status-draft-border: rgba(240, 140, 0, 0.45);

        /* Modern Tactile & Ambient Shadows */
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.55);
        --shadow-modal: 0 20px 50px rgba(0, 0, 0, 0.75);
        --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        --btn-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
        --focus-ring: 0 0 0 3px rgba(56, 189, 248, 0.45);
      }

      [data-theme="light"] {
        color-scheme: light;
        /* Premium Colorful Studio — Crisp Alabaster & Multi-Hue Light Mode */
        --bg-body: #f3f6fc;
        --bg-surface: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #eef3fb;
        --bg-input: #eef3fa;
        --bg-elevated: #e4ecf8;

        --text-primary: #0b1120;
        --text-secondary: #3b4963;
        --text-muted: #5b6b86;

        --border-subtle: #dce4f2;
        --border-strong: #bcc9e0;
        --border-focus: #0284c7;

        /* Brand & Primary Action Tokens */
        --brand-purple: #364fc7;
        --brand-purple-hover: #2b42b8;
        --brand-purple-dark: #1e329e;
        --brand-purple-subtle: #e0e7ff;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --primary-active: #075985;
        --primary-subtle: #e0f2fe;
        --primary-ink: #ffffff;

        /* Multi-Hue Semantic & Category Accents (High-Contrast on Light Grounds) */
        --accent-sky: #0369a1;
        --accent-sky-subtle: #e0f2fe;
        --accent-emerald: #047857;
        --accent-emerald-subtle: #d1fae5;
        --accent-amber: #b45309;
        --accent-amber-subtle: #fef3c7;
        --accent-rose: #be123c;
        --accent-rose-subtle: #ffe4e6;
        --accent-violet: #862e9c;
        --accent-violet-subtle: #f3d9fa;
        --accent-teal: #0f766e;
        --accent-teal-subtle: #ccfbf1;
        --accent-coral: #c2410c;
        --accent-coral-subtle: #ffedd5;
        --accent-lime: #3f6212;
        --accent-lime-subtle: #ecfccb;

        /* 4-Answer Gameplay Tokens */
        --k-red: #e63946;
        --k-red-dark: #b91c1c;
        --k-red-hover: #c92a2a;
        --k-blue: #3578d4;
        --k-blue-dark: #194d99;
        --k-blue-hover: #245ea8;
        --k-yellow: #f08c00;
        --k-yellow-dark: #b45309;
        --k-yellow-hover: #d97706;
        --k-yellow-ink: #ffffff;
        --k-green: #12b886;
        --k-green-dark: #047857;
        --k-green-hover: #059669;

        /* Unified 6 Game Format Tokens */
        --game-mc: #e03131;
        --game-mc-hover: #be123c;
        --game-mc-subtle: #ffe4e6;
        --game-qb: #1c64c4;
        --game-qb-hover: #194d99;
        --game-qb-subtle: #dbeafe;
        --game-fill: #d97706;
        --game-fill-hover: #b45309;
        --game-fill-subtle: #fef3c7;
        --game-cross: #059669;
        --game-cross-hover: #047857;
        --game-cross-subtle: #d1fae5;
        --game-mixed: #9c36b5;
        --game-mixed-hover: #862e9c;
        --game-mixed-subtle: #f3d9fa;
        --game-adventure: #ea580c;
        --game-adventure-hover: #c2410c;
        --game-adventure-subtle: #ffedd5;

        /* Game Cover & Illustration Stage Tokens (Light Mode) */
        --home-cover-bg: #eaf1fb;
        --home-cover-secondary: #dbe6f6;
        --home-cover-panel: #ffffff;
        --discover-cover-bg: #eaf1fb;
        --discover-cover-secondary: #dbe6f6;
        --discover-cover-panel: #ffffff;
        --cover-mc-bg: #fff1f3;
        --cover-mc-secondary: #ffe0e6;
        --cover-qb-bg: #eff6ff;
        --cover-qb-secondary: #dbeafe;
        --cover-fill-bg: #fffbeb;
        --cover-fill-secondary: #fef3c7;
        --cover-cross-bg: #ecfdf5;
        --cover-cross-secondary: #d1fae5;
        --cover-mixed-bg: #f8f0fc;
        --cover-mixed-secondary: #f3d9fa;
        --cover-adv-bg: #f0f6ff;
        --cover-adv-secondary: #e0ecff;
        --cover-ink-strong: #0f172a;
        --cover-ink-muted: #475569;
        --discover-cover-badge-bg: rgba(255, 255, 255, 0.96);
        --discover-cover-badge-text: #0b1120;
        --discover-cover-badge-border: #bcc9e0;
        --discover-status-pub-bg: #ecfdf5;
        --discover-status-pub-text: #047857;
        --discover-status-pub-border: #6ee7b7;
        --discover-status-draft-bg: #fffbeb;
        --discover-status-draft-text: #b45309;
        --discover-status-draft-border: #fcd34d;

        /* Elevation & 3D Tactile Shadows */
        --shadow-sm: 0 2px 0 rgba(15, 23, 42, 0.06);
        --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 10px 24px rgba(15, 23, 42, 0.1);
        --shadow-modal: 0 20px 40px rgba(15, 23, 42, 0.18);
        --card-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        --btn-shadow: 0 3px 0 rgba(15, 23, 42, 0.1);
        --focus-ring: 0 0 0 3px rgba(2, 132, 199, 0.35);
      }

      /* Modern Cyber & Studio Button Utilities */
      .k-btn {
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justifyContent: center;
        gap: 0.5rem;
        border: 1px solid transparent;
        transition: transform 0.1s ease, box-shadow 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
        user-select: none;
      }
      .k-btn:active:not(:disabled) {
        transform: translateY(1.5px) !important;
      }

      .k-btn-purple {
        background-color: var(--brand-purple);
        color: #ffffff;
      }
      .k-btn-purple:hover:not(:disabled) {
        background-color: var(--brand-purple-hover);
      }

      .k-btn-red {
        background-color: var(--k-red);
        color: #ffffff;
      }
      .k-btn-red:hover:not(:disabled) {
        background-color: var(--k-red-hover);
      }

      .k-btn-blue {
        background-color: var(--k-blue);
        color: #ffffff;
      }
      .k-btn-blue:hover:not(:disabled) {
        background-color: var(--k-blue-hover);
      }

      .k-btn-yellow {
        background-color: var(--k-yellow);
        color: var(--k-yellow-ink);
      }
      .k-btn-yellow:hover:not(:disabled) {
        background-color: var(--k-yellow-hover);
      }

      .k-btn-green {
        background-color: var(--k-green);
        color: #ffffff;
      }
      .k-btn-green:hover:not(:disabled) {
        background-color: var(--k-green-hover);
      }

      .k-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        box-shadow: var(--card-shadow); /* taste-skill-ignore */
        transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
      }
      .k-card:hover {
        border-color: var(--border-strong);
      }

      /* Base Flat Utility Classes */
      .flat-card {
        border-radius: 14px;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        box-shadow: var(--card-shadow); /* taste-skill-ignore */
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }
      .flat-card:hover {
        border-color: var(--border-strong);
      }

      /* the9bit AI Studio Pill & Badge */
      .studio-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* Numeric Data Alignment */
      .tabular-nums, table td, table th, [data-tabular] {
        font-variant-numeric: tabular-nums;
      }

      /* Global Layout & Typography */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans, 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
        background-color: var(--bg-body);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.18s ease, color 0.18s ease;
      }

      html {
        font-family: var(--font-sans, 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
      }

      input, select, textarea, button, optgroup, option, dialog, svg text {
        font-family: inherit;
        font-size: inherit;
      }

      /* Global Focus Rings (WCAG AA a11y) */
      :focus-visible {
        outline: none;
        box-shadow: var(--focus-ring) !important; /* taste-skill-ignore */
      }

      /* Interactive Button Base */
      button {
        transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      /* Custom Accessible Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-body);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Micro-Animations & Pop-in */
      @keyframes popIn {
        0% { transform: scale(0.96); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Prefers-reduced-motion: respect user motion accessibility */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Responsive Navigation Breakpoints (the9bit Left-Dock Layout) */
      @media (min-width: 768px) {
        .mobile-bottom-nav {
          display: none !important;
        }
        .app-layout-left-nav,
        .app-layout-right-nav {
          display: flex !important;
        }
        .app-main-content-with-nav {
          margin-left: 220px !important;
          margin-right: 0 !important;
        }
      }
      @media (max-width: 767px) {
        .desktop-nav {
          display: none !important;
        }
        .app-layout-left-nav,
        .app-layout-right-nav {
          display: none !important;
        }
        .app-main-content-with-nav {
          margin-left: 0 !important;
          margin-right: 0 !important;
          padding-bottom: 5rem !important;
        }
      }

      /* Creator Studio Fullscreen Viewport (No Window Scroll) */
      @media (min-width: 960px) {
        .creator-studio-page {
          height: 100vh !important;
          max-height: 100vh !important;
          overflow: hidden !important;
        }
        .creator-studio-grid {
          display: grid !important;
          grid-template-columns: 1.05fr 0.95fr !important;
          gap: 1rem !important;
          flex: 1 !important;
          min-height: 0 !important;
        }
        .mixed-config-grid {
          display: grid !important;
          grid-template-columns: 1.15fr 0.85fr !important;
          gap: 0.85rem !important;
          align-items: stretch !important;
        }
      }
      @media (max-width: 959px) {
        .creator-studio-page {
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }
        .creator-studio-grid {
          display: flex !important;
          flex-direction: column !important;
          gap: 1rem !important;
        }
        .mixed-config-grid {
          display: flex !important;
          flex-direction: column !important;
          gap: 0.85rem !important;
        }
      }

      /* Explore Page Fullscreen Viewport (No Window Scroll on Desktop) */
      @media (min-width: 960px) {
        .explore-page-container {
          height: 100vh !important;
          max-height: 100vh !important;
          overflow: hidden !important;
        }
        .explore-cards-grid {
          grid-template-columns: repeat(5, 1fr) !important;
        }
      }
      @media (max-width: 959px) and (min-width: 640px) {
        .explore-page-container {
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }
        .explore-cards-grid {
          grid-template-columns: repeat(2, 1fr) !important;
        }
      }
      @media (max-width: 639px) {
        .explore-page-container {
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }
        .explore-cards-grid {
          grid-template-columns: 1fr !important;
        }
      }

      /* the9bit Arcade Cards Layout */
      .arcade-cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1.25rem;
      }
      @media (min-width: 1140px) {
        .arcade-cards-grid {
          grid-template-columns: repeat(5, 1fr) !important;
        }
      }
      @media (max-width: 1139px) and (min-width: 640px) {
        .arcade-cards-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
