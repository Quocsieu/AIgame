<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Content &rarr; Question &rarr; Game Platform</title>
    <style>
      :root,
      [data-theme="dark"] {
        --bg-body: #090d16;
        --bg-surface: #0f172a;
        --bg-card: #131c31;
        --bg-card-hover: #1a2744;
        --bg-input: #090d16;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-subtle: #1e293b;
        --border-strong: #334155;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-glow: rgba(37, 99, 235, 0.4);
        --accent-sky: #38bdf8;
        --accent-emerald: #10b981;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        --btn-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      }

      [data-theme="light"] {
        --bg-body: #f1f5f9;
        --bg-surface: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f8fafc;
        --bg-input: #f8fafc;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border-subtle: #e2e8f0;
        --border-strong: #cbd5e1;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-glow: rgba(37, 99, 235, 0.25);
        --accent-sky: #0284c7;
        --accent-emerald: #059669;
        --accent-amber: #d97706;
        --accent-rose: #dc2626;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        --btn-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-body);
        color: var(--text-primary);
        min-height: 100vh;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      input, select, textarea, button {
        font-family: inherit;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-body);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 15px var(--primary-glow); }
        50% { box-shadow: 0 0 25px var(--primary-glow), 0 0 35px var(--primary-glow); }
      }
      @keyframes popIn {
        0% { transform: scale(0.92); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes countdownTick {
        from { transform: scaleX(1); }
        to { transform: scaleX(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
