<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Game - AI Game Platform</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 2rem; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { margin-top: 0; font-size: 1.75rem; text-align: center; color: #38bdf8; }
    label { display: block; margin-top: 1.25rem; margin-bottom: 0.4rem; color: #94a3b8; font-weight: 600; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; box-sizing: border-box; }
    input[type="text"]:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; margin-top: 1.5rem; padding: 0.85rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error-msg { color: #ef4444; margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Join Game</h1>
    <form id="joinForm">
      <label for="roomCodeInput">ROOM CODE</label>
      <input type="text" id="roomCodeInput" maxlength="6" placeholder="e.g. ABC123" required style="text-transform: uppercase; letter-spacing: 2px; font-weight: 700; text-align: center;" />

      <label for="displayNameInput">YOUR NICKNAME</label>
      <input type="text" id="displayNameInput" maxlength="30" placeholder="e.g. Siêu Nguyễn" required />

      <button type="submit" id="btnJoin">Enter Game</button>
      <div id="joinError" class="error-msg"></div>
    </form>
  </div>

  <script>
    // Prefill room code from query params
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('room');
    if (codeParam) {
      document.getElementById('roomCodeInput').value = codeParam.toUpperCase().trim();
      document.getElementById('displayNameInput').focus();
    } else {
      document.getElementById('roomCodeInput').focus();
    }

    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      const displayName = document.getElementById('displayNameInput').value.trim();

      if (!roomCode || !displayName) {
        document.getElementById('joinError').textContent = 'Please enter both room code and nickname.';
        return;
      }

      window.location.href = `/play.html?room=${encodeURIComponent(roomCode)}&name=${encodeURIComponent(displayName)}`;
    });
  </script>
</body>
</html>
