<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - Live Game</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1rem; background: #0f172a; color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; margin-bottom: 1rem; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #334155; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 4px; background: #334155; color: #38bdf8; font-weight: 600; font-size: 0.85rem; }
    .badge-success { background: #14532d; color: #4ade80; }
    .badge-danger { background: #7f1d1d; color: #f87171; }
    .choice-btn { display: block; width: 100%; text-align: left; margin-top: 0.75rem; padding: 1rem 1.25rem; background: #334155; color: white; border: 2px solid #475569; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: all 0.15s; }
    .choice-btn:hover { background: #475569; border-color: #38bdf8; }
    .choice-btn.selected { background: #1e3a8a; border-color: #38bdf8; color: #38bdf8; font-weight: 700; }
    .choice-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; box-sizing: border-box; }
    button.submit-btn { width: 100%; margin-top: 1rem; padding: 0.85rem; background: #16a34a; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    button.submit-btn:hover { background: #15803d; }
    button.submit-btn:disabled { background: #475569; cursor: not-allowed; }
    .timer-bar { height: 6px; background: #22c55e; border-radius: 3px; margin: 0.5rem 0 1rem 0; transition: width 0.25s linear; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #334155; }
    tr.me { background: #1e3a8a; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-bar">
      <div>
        <span style="color: #94a3b8; font-size: 0.85rem;">Player:</span>
        <strong id="displayPlayerName" style="color: #38bdf8;">...</strong>
      </div>
      <div>
        <span style="color: #94a3b8; font-size: 0.85rem;">Score:</span>
        <strong id="displayPlayerScore" style="color: #4ade80; font-size: 1.2rem;">0</strong>
      </div>
    </div>

    <!-- Lobby State -->
    <div class="card" id="lobbyScreen" style="text-align: center; padding: 3rem 1.5rem;">
      <h2 style="color: #38bdf8;">You're in the room!</h2>
      <p style="color: #94a3b8; font-size: 1.1rem;">Waiting for the host to start the game...</p>
      <div style="margin-top: 2rem;">
        <span class="badge" id="lobbyRoomBadge">ROOM: ------</span>
      </div>
    </div>

    <!-- Question State -->
    <div class="card" id="questionScreen" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="badge" id="qIndexBadge">Q 1/5</span>
        <span id="timerText" style="color: #38bdf8; font-weight: 700;">20s</span>
      </div>
      <div class="timer-bar" id="timerBar" style="width: 100%;"></div>

      <h3 id="questionText" style="margin: 1rem 0 1.5rem 0; font-size: 1.25rem;">Question text goes here</h3>

      <div id="choicesContainer"></div>

      <!-- Submission Status Message -->
      <div id="submissionMessage" style="display: none; margin-top: 1.5rem; text-align: center; color: #38bdf8; font-weight: 600;">
        ✓ Answer submitted! Waiting for reveal...
      </div>
    </div>

    <!-- Reveal State -->
    <div class="card" id="revealScreen" style="display: none; text-align: center;">
      <div id="feedbackBadgeContainer"></div>
      <h3 id="feedbackTitle" style="margin: 0.75rem 0;">Result</h3>
      <p id="feedbackPoints" style="font-weight: 700; color: #4ade80; font-size: 1.2rem;"></p>
      <p style="color: #94a3b8; font-size: 0.95rem;">Correct Answer: <strong id="feedbackCorrectAnswer" style="color: #f8fafc;"></strong></p>
      <p id="feedbackExplanation" style="color: #64748b; font-size: 0.85rem; font-style: italic;"></p>

      <div style="margin-top: 1.5rem; text-align: left;">
        <h4 style="color: #94a3b8; margin-bottom: 0.5rem;">Leaderboard</h4>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="playerLeaderboardBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Finished State -->
    <div class="card" id="finishScreen" style="display: none; text-align: center; padding: 2.5rem 1.5rem;">
      <h2 style="color: #facc15;">Game Finished!</h2>
      <p style="color: #94a3b8;">Final Score: <strong id="finalScoreText" style="color: #4ade80; font-size: 1.5rem;"></strong></p>
      <p id="finalRankText" style="color: #38bdf8; font-size: 1.2rem; font-weight: 700;"></p>
      <div style="margin-top: 1.5rem;">
        <button type="button" class="submit-btn" onclick="window.location.href='/join.html'">Join Another Game</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = (urlParams.get('room') || '').toUpperCase().trim();
    const displayName = (urlParams.get('name') || '').trim();

    if (!roomCode || !displayName) {
      window.location.href = '/join.html';
    }

    let ws = null;
    let myPlayerId = '';
    let myPlayerToken = sessionStorage.getItem(`token_${roomCode}`) || '';
    let currentQuestionId = '';
    let timerInterval = null;
    let selectedAnswer = null;

    function renderSafeText(element, text) {
      element.textContent = text == null ? '' : String(text);
    }

    renderSafeText(document.getElementById('displayPlayerName'), displayName);
    renderSafeText(document.getElementById('lobbyRoomBadge'), `ROOM: ${roomCode}`);

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        if (myPlayerToken) {
          // Reconnect attempt
          ws.send(JSON.stringify({
            type: 'player.reconnect',
            roomCode,
            playerToken: myPlayerToken,
          }));
        } else {
          // Initial join
          ws.send(JSON.stringify({
            type: 'player.join',
            roomCode,
            displayName,
          }));
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handlePlayerEvent(msg);
        } catch (err) {
          console.error('Failed to parse WebSocket message', err);
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected.');
      };
    }

    function handlePlayerEvent(msg) {
      switch (msg.type) {
        case 'room.joined':
          if (msg.playerToken) {
            myPlayerToken = msg.playerToken;
            sessionStorage.setItem(`token_${roomCode}`, myPlayerToken);
          }
          if (msg.playerId) {
            myPlayerId = msg.playerId;
          }
          break;

        case 'game.started':
          document.getElementById('lobbyScreen').style.display = 'none';
          break;

        case 'question.started':
          renderPlayerQuestion(msg.question);
          break;

        case 'question.answerReceived':
          document.getElementById('submissionMessage').style.display = 'block';
          break;

        case 'question.timeUp':
          if (timerInterval) clearInterval(timerInterval);
          disableAnswerControls();
          break;

        case 'question.revealed':
          renderPlayerReveal(msg);
          break;

        case 'game.finished':
          renderPlayerFinal(msg);
          break;

        case 'error':
          alert(`Game notice: ${msg.message}`);
          break;
      }
    }

    function renderPlayerQuestion(q) {
      currentQuestionId = q.id;
      selectedAnswer = null;

      document.getElementById('revealScreen').style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('questionScreen').style.display = 'block';
      document.getElementById('submissionMessage').style.display = 'none';

      renderSafeText(document.getElementById('qIndexBadge'), `Q ${q.questionIndex + 1} / ${q.totalQuestions}`);
      renderSafeText(document.getElementById('questionText'), q.question);

      const container = document.getElementById('choicesContainer');
      container.innerHTML = '';

      if (q.type === 'MULTIPLE_CHOICE' || q.type === 'QUICK_BUTTON') {
        const choices = q.choices || [];
        choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'choice-btn';
          renderSafeText(btn, choice);
          btn.addEventListener('click', () => {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedAnswer = choice;
            submitAnswer(choice);
          });
          container.appendChild(btn);
        });
      } else if (q.type === 'FILL_IN_THE_BLANK') {
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'fibInput';
        input.placeholder = 'Type your answer...';
        container.appendChild(input);

        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'submit-btn';
        renderSafeText(subBtn, 'Submit Answer');
        subBtn.addEventListener('click', () => {
          const val = input.value.trim();
          if (val) submitAnswer(val);
        });
        container.appendChild(subBtn);
      } else if (q.type === 'CROSSWORD') {
        if (q.crosswordClue) {
          const clueP = document.createElement('p');
          clueP.style.color = '#38bdf8';
          renderSafeText(clueP, `Clue: ${q.crosswordClue}`);
          container.appendChild(clueP);
        }
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'cwInput';
        input.placeholder = 'Enter word...';
        container.appendChild(input);

        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'submit-btn';
        renderSafeText(subBtn, 'Submit Word');
        subBtn.addEventListener('click', () => {
          const val = input.value.trim();
          if (val) submitAnswer(val);
        });
        container.appendChild(subBtn);
      }

      startPlayerTimer(q.timePerQuestion);
    }

    function submitAnswer(ans) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      disableAnswerControls();

      ws.send(JSON.stringify({
        type: 'player.answer',
        questionId: currentQuestionId,
        answer: ans,
      }));
    }

    function disableAnswerControls() {
      document.querySelectorAll('.choice-btn, .submit-btn, input').forEach(el => {
        el.disabled = true;
      });
    }

    function startPlayerTimer(durationSec) {
      if (timerInterval) clearInterval(timerInterval);
      let remaining = durationSec;
      const timerText = document.getElementById('timerText');
      const timerBar = document.getElementById('timerBar');

      renderSafeText(timerText, `${remaining}s`);
      timerBar.style.width = '100%';

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          renderSafeText(timerText, '0s');
          timerBar.style.width = '0%';
        } else {
          renderSafeText(timerText, `${remaining}s`);
          const pct = Math.max(0, (remaining / durationSec) * 100);
          timerBar.style.width = `${pct}%`;
        }
      }, 1000);
    }

    function renderPlayerReveal(msg) {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('questionScreen').style.display = 'none';
      document.getElementById('revealScreen').style.display = 'block';

      const pResult = msg.personalResult;
      const isCorrect = pResult && pResult.isCorrect;

      const badgeContainer = document.getElementById('feedbackBadgeContainer');
      badgeContainer.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = isCorrect ? 'badge badge-success' : 'badge badge-danger';
      renderSafeText(badge, isCorrect ? '✓ CORRECT' : '✗ INCORRECT');
      badgeContainer.appendChild(badge);

      renderSafeText(document.getElementById('feedbackTitle'), isCorrect ? 'Great Job!' : 'Better luck on next question');
      renderSafeText(document.getElementById('feedbackPoints'), pResult ? `+${pResult.pointsEarned} pts` : '+0 pts');
      renderSafeText(document.getElementById('feedbackCorrectAnswer'), msg.correctAnswer);
      renderSafeText(document.getElementById('feedbackExplanation'), msg.explanation ? `(${msg.explanation})` : '');

      // Update personal score display if on leaderboard
      if (msg.leaderboard) {
        const me = msg.leaderboard.find(e => e.playerId === myPlayerId);
        if (me) {
          renderSafeText(document.getElementById('displayPlayerScore'), me.score);
        }

        const tbody = document.getElementById('playerLeaderboardBody');
        tbody.innerHTML = '';
        msg.leaderboard.slice(0, 10).forEach(entry => {
          const tr = document.createElement('tr');
          if (entry.playerId === myPlayerId) tr.className = 'me';

          const tdRank = document.createElement('td');
          renderSafeText(tdRank, entry.rank);
          const tdName = document.createElement('td');
          renderSafeText(tdName, entry.displayName);
          const tdScore = document.createElement('td');
          renderSafeText(tdScore, entry.score);

          tr.appendChild(tdRank);
          tr.appendChild(tdName);
          tr.appendChild(tdScore);
          tbody.appendChild(tr);
        });
      }
    }

    function renderPlayerFinal(msg) {
      document.getElementById('questionScreen').style.display = 'none';
      document.getElementById('revealScreen').style.display = 'none';
      document.getElementById('finishScreen').style.display = 'block';

      if (msg.leaderboard) {
        const me = msg.leaderboard.find(e => e.playerId === myPlayerId);
        if (me) {
          renderSafeText(document.getElementById('finalScoreText'), me.score);
          renderSafeText(document.getElementById('finalRankText'), `You finished #${me.rank} out of ${msg.leaderboard.length} players!`);
        }
      }
    }

    connect();
  </script>
</body>
</html>
